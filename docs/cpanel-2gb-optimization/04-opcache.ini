; OPcache — cPanel PHP-FPM — Laravel 12 — 2GB
; Apply via: WHM > MultiPHP INI Editor > Editor Mode (php.ini) or /opt/alt/phpXX/etc/php.d/10-opcache.ini
; CLI baseline: opcache.enable On, memory_consumption 128, max_accelerated_files 10000, save_comments On, validate_timestamps On (Herd Lite)
; XAMPP baseline: all opcache.* commented (php.ini:1679-1705) — must enable on cPanel

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.max_wasted_percentage=5
opcache.use_cwd=1
; Prod: validate_timestamps Off + revalidate_freq 0 = fastest, manual restart after deploy. Dev: On + 2
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.revalidate_path=0
opcache.save_comments=1
opcache.enable_file_override=0
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
; For Laravel, save_comments must be 1 (annotations, etc.)
; After each git/zip deploy, run: php artisan optimize:clear && systemctl reload ea-phpXX-php-fpm (or WHM reload)
