# Apache 2.4.68 MPM Event — 2GB cPanel — 50-70 concurrent users
# Apply via: WHM > Apache Configuration > Global Configuration (EasyApache 4)
# Prereq: Ensure MPM = event (httpd -V | grep MPM). If prefork, recompile via EA4: Apache MPM event + mod_proxy_fcgi + php-fpm
# Local XAMPP baseline: WinNT ThreadsPerChild 150 (httpd-mpm.conf:106) — NOT suitable for prod Linux

<IfModule mpm_event_module>
    ServerLimit              10
    StartServers              2
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadLimit              64
    ThreadsPerChild          25
    MaxRequestWorkers       120  # 120 threads ≈ 100-120 concurrent FPM proxy; 400 is OOM on 2GB
    MaxConnectionsPerChild 1000  # recycle after 1000 conn (prevent leaks)
</IfModule>

# KeepAlive — reduces TLS/handshake for Livewire polling
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2
Timeout 60
RequestReadTimeout header=20-40,minrate=500
# Disable .htaccess override where possible for per-request perf (requires WHM Include)
# <Directory "/home/yourdomain/public_html">
#   AllowOverride FileInfo
# </Directory>
# Enable compression + expires via cPanel > Optimize Website or .htaccess:
# AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
# ExpiresActive On + ExpiresByType application/javascript "access plus 1 year"
