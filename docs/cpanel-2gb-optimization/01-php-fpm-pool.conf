; cPanel PHP-FPM Pool — 2GB RAM — 50-70 concurrent users
; Apply via: WHM > MultiPHP Manager > PHP-FPM Settings > Edit Pool (yourdomain) or /opt/alt/phpXX/etc/php-fpm.d/yourdomain.conf
; Requires: Apache mpm_event + mod_proxy_fcgi (not mpm_prefork)
; Baseline: XAMPP local memory_limit 512M, CLI 8.5.0, prod target 256M per child, ~60MB avg Laravel+Livewire

[pool_yourdomain]
; Use 'ondemand' for 2GB bursty load (spawns on demand, idle timeout reclaims RAM). Alternative 'dynamic' if steady.
pm = ondemand
pm.max_children = 12          ; 12 * 60MB ≈ 720MB max; safe for 2GB (see README formula). Do NOT set 30+ on 2GB
pm.process_idle_timeout = 10s ; ondemand: kill idle after 10s
; If using dynamic instead, uncomment:
; pm = dynamic
; pm.start_servers = 4
; pm.min_spare_servers = 2
; pm.max_spare_servers = 6
pm.max_requests = 500         ; recycle worker after 500 requests (prevent leaks)
; Timeouts
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /home/yourdomain/logs/php-fpm-slow.log
; PHP admin values (override .user.ini / cPanel MultiPHP INI)
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[display_errors] = 0
php_admin_flag[log_errors] = on
; Opcache already in 04-opcache.ini, but ensure:
; php_admin_value[opcache.enable] = 1
; Security
php_admin_value[expose_php] = 0
php_admin_value[session.gc_maxlifetime] = 7200
; For queue workers via cron, keep CLI memory separate (512M CLI is ok)
